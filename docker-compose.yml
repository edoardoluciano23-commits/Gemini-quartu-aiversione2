services:
  web:
    build: .
    restart: unless-stopped
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL_BASE: ${LLM_MODEL_BASE:-MichelRosselli/ternary-bonsai:1.7b-f16}
      LLM_MODEL_PRO: ${LLM_MODEL_PRO:-qwen3.5:4b}
      LLM_TIMEOUT_MS: "120000"
      DATABASE_PATH: /data/chat.db
      TRUST_PROXY: "true"
    volumes:
      - sqlite-data:/data
    expose:
      - "3000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Nessuna porta pubblicata sull'host: Ollama è raggiungibile
    # esclusivamente dalla rete Docker interna.
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Montare qui i certificati reali (fullchain.pem, privkey.pem):
      # non sono e non devono essere inclusi nel repository.
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  sqlite-data:
  ollama-models:

networks:
  internal:
    driver: bridge
